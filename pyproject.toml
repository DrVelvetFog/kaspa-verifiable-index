[project]
name = "kaspa-verifiable-index"
version = "0.1.0"
description = "Verifiable getUtxosByCovenantId over Kaspa node truth, with fail-closed indexer cross-check"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
